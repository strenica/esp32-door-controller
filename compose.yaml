# Lokalni test Vrata (strežnik). Vse je v kontejnerjih – na gostitelja se ne
# namesti nič razen container runtimea. Izbrišeš z: docker compose down -v
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: vrata
      MARIADB_USER: vrata
      MARIADB_PASSWORD: vrata
      MARIADB_ROOT_PASSWORD: root
    volumes:
      # install.sql se uvozi samodejno ob prvem zagonu (prazna baza).
      - ./server/oss/install.sql:/docker-entrypoint-initdb.d/install.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build: ./deploy/php
    ports:
      - "8000:80"
    volumes:
      # Živa koda: urejanje datotek v server/oss se takoj pozna, brez rebuilda.
      - ./server/oss:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
